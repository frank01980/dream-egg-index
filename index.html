<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  html { color-scheme: light dark; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>Dream Egg Index</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root {
  --bg: #eef0f5;
  --surface: #ffffff;
  --ink: #1b1e2b;
  --muted: #5d6378;
  --line: #d6d9e3;
  --accent: #4b4fd6;
  --ph-bg: #23263a;
  --ph-ink: #b9bdd6;
  --r-common: #8a8fa3;
  --r-uncommon: #22a06b;
  --r-rare: #2f7fd6;
  --r-epic: #9a4fd6;
  --r-legendary: #e8912a;
  --r-mythic: #e0445e;
  --r-secret: #ec4899;
  --r-eternal: #0d9488;
  --r-divine: #c99a1e;
  --r-cosmic: #4338ca;
  --heart: #e0445e;
  --ok: #22a06b;
  --font-display: "Chakra Petch", "Trebuchet MS", sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12131c; --surface: #1c1e2b; --ink: #e9eaf3; --muted: #9a9fb8; --line: #2e3144;
    --accent: #8d90ff; --ph-bg: #0b0c13; --ph-ink: #7d82a3; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12131c; --surface: #1c1e2b; --ink: #e9eaf3; --muted: #9a9fb8; --line: #2e3144;
  --accent: #8d90ff; --ph-bg: #0b0c13; --ph-ink: #7d82a3; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 1200px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
header h1 {
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(1.8rem, 4vw, 2.6rem); margin: 0; letter-spacing: .01em;
  text-wrap: balance;
}
header p { margin: 4px 0 0; color: var(--muted); max-width: 60ch; }
.controls {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 16px 12px; margin-top: 16px;
  border-bottom: 1px solid var(--line);
  display: grid; gap: 10px;
}
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search {
  flex: 1 1 220px; min-width: 0;
  padding: 10px 12px; font: inherit; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
}
select {
  padding: 10px 12px; font: inherit; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
}
.label {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .08em; color: var(--muted); margin-right: 4px;
}
.chip {
  font: inherit; font-size: 13px; font-weight: 500;
  padding: 5px 12px; border-radius: 999px; cursor: pointer;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line);
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-left: auto; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.statsbar {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  margin-top: 18px; padding: 10px 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  font-family: var(--font-mono); font-size: 13px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.statsbar b { color: var(--ink); font-weight: 500; }
.statsbar .sep { opacity: .4; }
.loadmore-wrap { display: flex; justify-content: center; margin-top: 24px; }
.loadmore {
  font: inherit; font-weight: 600; font-size: 14px;
  padding: 11px 28px; border-radius: 999px; cursor: pointer;
  background: var(--accent); color: var(--surface); border: none;
}
.loadmore:hover { filter: brightness(1.08); }
.grid {
  display: grid; gap: 18px; margin-top: 20px;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
}
.card {
  position: relative; background: var(--surface);
  border: 2px solid var(--line); border-radius: 12px; padding: 8px;
  display: flex; flex-direction: column; gap: 8px; cursor: pointer;
  text-align: left; font: inherit; color: inherit;
  transition: transform .18s ease, box-shadow .18s ease;
}
.card:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgb(0 0 0 / .14); }
.card[data-rarity="Uncommon"]  { border-color: var(--r-uncommon); }
.card[data-rarity="Rare"]      { border-color: var(--r-rare); }
.card[data-rarity="Epic"]      { border-color: var(--r-epic); }
.card[data-rarity="Legendary"] { border-color: var(--r-legendary); }
.card[data-rarity="Mythic"]    { border-color: var(--r-mythic); }
.card[data-rarity="Secret"]    { border-color: var(--r-secret); }
.card[data-rarity="Eternal"]   { border-color: var(--r-eternal); }
.card[data-rarity="Divine"]    { border-color: var(--r-divine); }
.card[data-rarity="Cosmic"]    { border-color: var(--r-cosmic); }
.card[data-rarity="Legendary"]::after,
.card[data-rarity="Mythic"]::after,
.card[data-rarity="Divine"]::after,
.card[data-rarity="Cosmic"]::after {
  content: ""; position: absolute; inset: 0; border-radius: 10px; pointer-events: none;
  box-shadow: 0 0 0 1px var(--glow, var(--r-legendary)), 0 0 18px -4px var(--glow, var(--r-legendary));
}
.card[data-rarity="Mythic"]  { --glow: var(--r-mythic); }
.card[data-rarity="Divine"]  { --glow: var(--r-divine); }
.card[data-rarity="Cosmic"]  { --glow: var(--r-cosmic); }
.frame {
  aspect-ratio: 1 / 1; max-width: 100%; border-radius: 8px; overflow: hidden;
  background: var(--ph-bg);
}
.frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.placeholder {
  width: 100%; height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px; padding: 10px;
  color: var(--ph-ink); text-align: center;
}
.placeholder svg { width: 34px; height: 34px; opacity: .8; }
.placeholder span { font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
.meta { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; padding-inline: 2px; }
.name { font-family: var(--font-display); font-weight: 700; font-size: 1rem; margin: 0; min-width: 0; overflow-wrap: anywhere; }
.power { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; padding-inline: 2px 2px; padding-bottom: 2px; }
.tag {
  font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em;
  padding: 2px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted);
}
.tag.rarity { color: var(--surface); border-color: transparent; background: var(--r-common); }
.tag.rarity[data-r="Uncommon"]  { background: var(--r-uncommon); }
.tag.rarity[data-r="Rare"]      { background: var(--r-rare); }
.tag.rarity[data-r="Epic"]      { background: var(--r-epic); }
.tag.rarity[data-r="Legendary"] { background: var(--r-legendary); }
.tag.rarity[data-r="Mythic"]    { background: var(--r-mythic); }
.tag.rarity[data-r="Secret"]    { background: var(--r-secret); }
.tag.rarity[data-r="Eternal"]   { background: var(--r-eternal); }
.tag.rarity[data-r="Divine"]    { background: var(--r-divine); }
.tag.rarity[data-r="Cosmic"]    { background: var(--r-cosmic); }
.fav {
  position: absolute; top: 14px; right: 14px; width: 32px; height: 32px;
  border-radius: 50%; border: none; cursor: pointer;
  background: rgb(0 0 0 / .45); color: #fff;
  display: grid; place-items: center; font-size: 16px; line-height: 1;
}
.fav[aria-pressed="true"] { color: var(--heart); background: #fff; }
.empty { margin-top: 40px; text-align: center; color: var(--muted); }
.backdrop {
  position: fixed; inset: 0; z-index: 20; background: rgb(8 9 16 / .6);
  display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px))
           max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.modal {
  background: var(--surface); color: var(--ink); border-radius: 14px;
  width: min(720px, 100%); max-height: 100%; overflow: auto;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; padding: 20px;
  position: relative;
}
.modal .frame { border: 2px solid var(--line); }
.modal h2 { font-family: var(--font-display); font-size: 1.7rem; margin: 0; text-wrap: balance; }
.modal .desc { color: var(--muted); margin: 10px 0 16px; }
.stats { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
.stats dt { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stats dd { margin: 0; font-family: var(--font-mono); font-size: 13px; }
.bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.close {
  position: fixed; z-index: 30;
  top: max(14px, env(safe-area-inset-top, 0px));
  right: max(14px, env(safe-area-inset-right, 0px));
  width: 42px; height: 42px;
  border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); font-size: 20px; line-height: 1; cursor: pointer;
  box-shadow: 0 4px 14px rgb(0 0 0 / .28);
}
.modal-fav {
  margin-top: 18px; font: inherit; font-weight: 600; padding: 9px 14px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.modal-fav[aria-pressed="true"] { color: var(--heart); border-color: var(--heart); }

/* ===== CLAIM FLOW ===== */
.claim { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
.claim h3 {
  font-family: var(--font-display); font-size: .95rem; font-weight: 700;
  margin: 0 0 4px; text-transform: uppercase; letter-spacing: .08em;
}
.claim .hint { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
.claim-row { display: flex; gap: 8px; flex-wrap: wrap; }
.claim input {
  flex: 1 1 180px; min-width: 0;
  padding: 10px 12px; font: inherit; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
}
.claim input.err { border-color: var(--heart); animation: shake .3s; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}
.claim button.go {
  font: inherit; font-weight: 700; font-size: 13px; letter-spacing: .06em;
  padding: 10px 22px; border-radius: 999px; cursor: pointer; border: none;
  background: var(--ok); color: #fff;
}
.claim button.go:hover { filter: brightness(1.08); }
.claim button.go:disabled { opacity: .55; cursor: not-allowed; }
.claim-msg { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.claim-msg.err { color: var(--heart); }
.profile {
  display: flex; gap: 12px; align-items: center;
  margin-top: 14px; padding: 12px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  animation: fadeUp .3s ease;
}
.profile img {
  width: 64px; height: 64px; border-radius: 50%;
  border: 2px solid var(--accent); object-fit: cover; flex: 0 0 auto;
}
.profile .pinfo { min-width: 0; }
.profile .pname { font-family: var(--font-display); font-weight: 700; font-size: 1rem; margin: 0; overflow-wrap: anywhere; }
.profile .pdisp { font-size: 13px; color: var(--muted); margin: 2px 0 0; }
.profile .pid { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin: 2px 0 0; }
.steps { margin-top: 14px; display: grid; gap: 8px; }
.step {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; font-size: 13px;
  opacity: 0; transform: translateY(6px);
  animation: fadeUp .35s ease forwards;
}
.step .icon {
  width: 22px; height: 22px; flex: 0 0 auto; display: grid; place-items: center;
  border-radius: 50%; border: 2px solid var(--line); color: var(--muted);
  font-size: 12px; font-weight: 700;
}
.step.spin .icon { border-color: var(--accent) transparent var(--accent) transparent; animation: rot 1s linear infinite; color: transparent; }
.step.done .icon { border-color: var(--ok); background: var(--ok); color: #fff; }
@keyframes rot { to { transform: rotate(360deg); } }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.success {
  margin-top: 14px; padding: 16px; border-radius: 12px; text-align: center;
  background: color-mix(in srgb, var(--ok) 12%, var(--surface));
  border: 2px solid var(--ok);
  animation: fadeUp .35s ease;
}
.success .big {
  width: 44px; height: 44px; margin: 0 auto 8px; border-radius: 50%;
  background: var(--ok); color: #fff; display: grid; place-items: center;
  font-size: 22px; font-weight: 700;
}
.success h4 { font-family: var(--font-display); font-size: 1.1rem; margin: 0 0 6px; }
.success p { margin: 0; font-size: 13px; color: var(--muted); }
.success .demo { margin-top: 8px; font-size: 11px; opacity: .7; }

@media (max-width: 560px) {
  .modal { grid-template-columns: 1fr; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .profile img { width: 56px; height: 56px; }
}
@media (prefers-reduced-motion: reduce) {
  .card { transition: none; }
  .card:hover { transform: none; }
  .step, .profile, .success { animation: none; opacity: 1; transform: none; }
}
</style>

<div class="wrap">
  <header>
    <h1>Dream Egg Index</h1>
    <p>Browse the collection. Search by name, filter by rarity or element, and tap a card to see its full stats.</p>
  </header>

  <div class="controls">
    <div class="row">
      <input id="search" class="search" type="search" placeholder="Search cards by name…" aria-label="Search cards">
      <select id="sort" aria-label="Sort cards">
        <option value="name">Sort: Name A–Z</option>
        <option value="power-desc">Sort: Power high → low</option>
        <option value="power-asc">Sort: Power low → high</option>
        <option value="rarity">Sort: Rarity</option>
      </select>
      <button id="favOnly" class="chip" aria-pressed="false">♥ Favorites only</button>
    </div>
    <div class="row" id="rarityRow"><span class="label">Rarity</span></div>
    <div class="row" id="elementRow"><span class="label">Element</span><span class="count" id="count"></span></div>
  </div>

  <div class="statsbar" id="statsbar"></div>

  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No cards match. Try clearing the search or picking "All".</p>
  <div class="loadmore-wrap"><button class="loadmore" id="loadMore" hidden>Load More</button></div>
</div>

<div class="backdrop" id="backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="close" id="mClose" aria-label="Close">✕</button>
    <div class="frame" id="mFrame"></div>
    <div>
      <h2 id="mTitle"></h2>
      <p class="desc" id="mDesc"></p>
      <dl class="stats">
        <dt>Rarity</dt><dd id="mRarity"></dd>
        <dt>Element</dt><dd id="mElement"></dd>
        <dt>Power</dt><dd><span id="mPower"></span><div class="bar"><i id="mBar"></i></div></dd>
        <dt>Card #</dt><dd id="mId"></dd>
      </dl>
      <button class="modal-fav" id="mFav" aria-pressed="false">♡ Add to favorites</button>

      <div class="claim">
        <h3>Claim This Item</h3>
        <p class="hint">Enter your username to receive this item.</p>
        <div class="claim-row" id="claimRow">
          <input id="claimUser" type="text" placeholder="Your username" autocomplete="off" spellcheck="false">
          <button class="go" id="claimBtn">CLAIM NOW</button>
        </div>
        <p class="claim-msg" id="claimMsg"></p>
        <div id="claimStage"></div>
      </div>
    </div>
  </div>
</div>

<script>
const DATA = [
  { id: 1, name: "Ember Fox",     rarity: "Common",    element: "Fire",  power: 42, image: "images/sample1.png", description: "A small fox whose tail glows like a campfire.", favorite: false },
  { id: 2, name: "Tidal Turtle",  rarity: "Uncommon",  element: "Water", power: 58, image: "images/sample2.png", description: "A calm turtle that rides ocean waves for fun.", favorite: false },
  { id: 3, name: "Moss Golem",    rarity: "Rare",      element: "Earth", power: 71, image: "images/sample3.png", description: "A gentle giant covered in soft green moss.", favorite: false },
  { id: 4, name: "Gale Hawk",     rarity: "Epic",      element: "Air",   power: 83, image: "images/sample4.png", description: "A fast bird that can fly faster than the wind.", favorite: false },
  { id: 5, name: "Spark Mouse",   rarity: "Common",    element: "Light", power: 35, image: "images/sample5.png", description: "A tiny mouse that lights up dark rooms.", favorite: false },
  { id: 6, name: "Nova Dragon",   rarity: "Legendary", element: "Light", power: 97, image: "images/sample6.png", description: "A very rare dragon made of shining starlight.", favorite: false },
];

const RARITIES = ["Common", "Uncommon", "Rare", "Epic", "Legendary", "Mythic", "Secret", "Eternal", "Divine", "Cosmic"];
const MAX_POWER = 100;
const PAGE = 24;
const API_BASE = "https://dream-egg-index.vercel.app/api/avatar";

const STORE_KEY = "cardvault-favs";
function loadFavs() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (Array.isArray(saved)) DATA.forEach(c => { c.favorite = saved.includes(c.id); });
  } catch (e) {}
}
function saveFavs() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(DATA.filter(c => c.favorite).map(c => c.id))); }
  catch (e) {}
}
const ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg>';
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));
}
function placeholderHtml(name) {
  return '<div class="placeholder">' + ICON + '<span>' + escapeHtml(name) + '</span></div>';
}
function showPlaceholder(img) {
  img.onerror = null;
  img.outerHTML = placeholderHtml(img.dataset.name || img.alt || "Card");
}
function imageHtml(card) {
  if (!card.image) return placeholderHtml(card.name);
  return '<img src="' + escapeHtml(card.image) + '" alt="' + escapeHtml(card.name) +
         '" data-name="' + escapeHtml(card.name) + '" loading="lazy" onerror="showPlaceholder(this)">';
}
const state = { search: "", rarity: "All", element: "All", sort: "name", favOnly: false };
let shown = PAGE;
function resetPage() { shown = PAGE; }
const $ = id => document.getElementById(id);
const grid = $("grid");
function buildChips(rowId, values, key) {
  const row = $(rowId);
  ["All", ...values].forEach(v => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = v;
    b.setAttribute("aria-pressed", String(state[key] === v));
    b.addEventListener("click", () => {
      state[key] = v;
      row.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === b)));
      resetPage();
      render();
    });
    row.insertBefore(b, row.querySelector(".count"));
  });
}
function getVisible() {
  const q = state.search.trim().toLowerCase();
  const list = DATA.filter(c =>
    (!q || c.name.toLowerCase().includes(q)) &&
    (state.rarity === "All" || c.rarity === state.rarity) &&
    (state.element === "All" || c.element === state.element) &&
    (!state.favOnly || c.favorite)
  );
  const byName = (a, b) => a.name.localeCompare(b.name);
  if (state.sort === "name") list.sort(byName);
  if (state.sort === "power-desc") list.sort((a, b) => b.power - a.power || byName(a, b));
  if (state.sort === "power-asc") list.sort((a, b) => a.power - b.power || byName(a, b));
  if (state.sort === "rarity") list.sort((a, b) => RARITIES.indexOf(b.rarity) - RARITIES.indexOf(a.rarity) || byName(a, b));
  return list;
}
function updateStats() {
  const favs = DATA.filter(c => c.favorite).length;
  $("statsbar").innerHTML =
    'Total: <b>' + DATA.length + '</b> <span class="sep">|</span> Favorites: <b>' + favs + '</b>';
}
function render() {
  const list = getVisible();
  const visible = list.slice(0, shown);
  grid.innerHTML = visible.map(c => `
    <div class="card" data-rarity="${escapeHtml(c.rarity)}" data-id="${c.id}" tabindex="0" role="button" aria-label="Open ${escapeHtml(c.name)}">
      <div class="frame">${imageHtml(c)}</div>
      <div class="meta">
        <h3 class="name">${escapeHtml(c.name)}</h3>
        <span class="power">PWR ${c.power}</span>
      </div>
      <div class="tags">
        <span class="tag rarity" data-r="${escapeHtml(c.rarity)}">${escapeHtml(c.rarity)}</span>
        <span class="tag">${escapeHtml(c.element)}</span>
      </div>
      <button class="fav" data-fav="${c.id}" aria-pressed="${c.favorite}" aria-label="Favorite ${escapeHtml(c.name)}">${c.favorite ? "♥" : "♡"}</button>
    </div>`).join("");
  $("count").textContent = list.length + " / " + DATA.length + " cards";
  $("empty").hidden = list.length > 0;
  const remaining = list.length - visible.length;
  const more = $("loadMore");
  more.hidden = remaining <= 0;
  more.textContent = "Load More (" + remaining + " more)";
  updateStats();
}
function toggleFav(id) {
  const c = DATA.find(x => x.id === id);
  if (!c) return;
  c.favorite = !c.favorite;
  saveFavs();
  render();
  if (openId === id) fillModal(c);
}
let openId = null;
let lastFocus = null;
function fillModal(c) {
  $("mFrame").innerHTML = imageHtml(c);
  $("mTitle").textContent = c.name;
  $("mDesc").textContent = c.description;
  $("mRarity").textContent = c.rarity;
  $("mElement").textContent = c.element;
  $("mPower").textContent = c.power + " / " + MAX_POWER;
  $("mBar").style.width = Math.min(100, (c.power / MAX_POWER) * 100) + "%";
  $("mId").textContent = "#" + String(c.id).padStart(3, "0");
  $("mFav").setAttribute("aria-pressed", String(c.favorite));
  $("mFav").textContent = c.favorite ? "♥ In favorites" : "♡ Add to favorites";
  resetClaim();
}
function openModal(id) {
  const c = DATA.find(x => x.id === id);
  if (!c) return;
  openId = id;
  lastFocus = document.activeElement;
  fillModal(c);
  $("backdrop").hidden = false;
  $("mClose").focus();
}
function closeModal() {
  $("backdrop").hidden = true;
  openId = null;
  if (lastFocus) lastFocus.focus();
}

/* ---------- Claim Flow ---------- */
const STEPS = [
  { key: "search",  label: "Searching for account..." },
  { key: "verify",  label: "Verifying user..." },
  { key: "prepare", label: "Preparing your item..." },
  { key: "deliver", label: "Delivering..." }
];
let claimBusy = false;
function resetClaim() {
  claimBusy = false;
  $("claimUser").value = "";
  $("claimUser").classList.remove("err");
  $("claimUser").disabled = false;
  $("claimBtn").disabled = false;
  $("claimBtn").textContent = "CLAIM NOW";
  $("claimMsg").textContent = "";
  $("claimMsg").className = "claim-msg";
  $("claimStage").innerHTML = "";
}
function stepHtml(i, st) {
  return '<div class="step" data-step="' + st.key + '">' +
         '<span class="icon">' + (i + 1) + '</span>' +
         '<span class="txt">' + st.label + '</span></div>';
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
async function lookupUser(username) {
  const url = API_BASE + "?username=" + encodeURIComponent(username);
  const r = await fetch(url, { headers: { Accept: "application/json" } });
  if (!r.ok) throw new Error("API " + r.status);
  const j = await r.json();
  if (!j || !j.id) return null;
  return j;
}
async function runClaim() {
  if (claimBusy) return;
  const input = $("claimUser");
  const user = input.value.trim();
  const msg = $("claimMsg");
  const stage = $("claimStage");
  if (!user) {
    input.classList.add("err");
    msg.textContent = "Please enter a username.";
    msg.className = "claim-msg err";
    setTimeout(() => input.classList.remove("err"), 500);
    return;
  }
  claimBusy = true;
  input.disabled = true;
  $("claimBtn").disabled = true;
  $("claimBtn").textContent = "WORKING...";
  msg.textContent = "Looking up username...";
  msg.className = "claim-msg";
  stage.innerHTML = "";
  let profile = null;
  try { profile = await lookupUser(user); } catch (e) { profile = null; }
  if (!profile) {
    claimBusy = false;
    input.disabled = false;
    $("claimBtn").disabled = false;
    $("claimBtn").textContent = "CLAIM NOW";
    msg.textContent = "Username not found. Please check and try again.";
    msg.className = "claim-msg err";
    input.classList.add("err");
    setTimeout(() => input.classList.remove("err"), 500);
    return;
  }
  msg.textContent = "";
  stage.innerHTML =
    '<div class="profile">' +
      '<img src="' + escapeHtml(profile.imageUrl) + '" alt="' + escapeHtml(profile.name) + '" onerror="this.style.display=\'none\'">' +
      '<div class="pinfo">' +
        '<p class="pname">@' + escapeHtml(profile.name) + '</p>' +
        '<p class="pdisp">' + escapeHtml(profile.displayName || profile.name) + '</p>' +
        '<p class="pid">ID: ' + escapeHtml(String(profile.id)) + '</p>' +
      '</div>' +
    '</div>';
  await sleep(700);
  const stepsWrap = document.createElement("div");
  stepsWrap.className = "steps";
  stepsWrap.innerHTML = STEPS.map((s, i) => stepHtml(i, s)).join("");
  stage.appendChild(stepsWrap);
  const stepEls = stepsWrap.querySelectorAll(".step");
  for (let i = 0; i < stepEls.length; i++) {
    const el = stepEls[i];
    el.classList.add("spin");
    await sleep(1400);
    el.classList.remove("spin");
    el.classList.add("done");
    el.querySelector(".icon").textContent = "✓";
  }
  const cardName = (DATA.find(x => x.id === openId) || {}).name || "Item";
  stage.insertAdjacentHTML("beforeend",
    '<div class="success">' +
      '<div class="big">✓</div>' +
      '<h4>Success!</h4>' +
      '<p>Your <b>' + escapeHtml(cardName) + '</b> is on its way to <b>@' + escapeHtml(profile.name) + '</b></p>' +
      '<p class="demo">This is a demo — no real item was sent.</p>' +
    '</div>');
  $("claimBtn").textContent = "DONE ✓";
  claimBusy = false;
}

/* ---------- Events ---------- */
grid.addEventListener("click", e => {
  const favBtn = e.target.closest("[data-fav]");
  if (favBtn) { e.stopPropagation(); toggleFav(Number(favBtn.dataset.fav)); return; }
  const card = e.target.closest(".card");
  if (card) openModal(Number(card.dataset.id));
});
grid.addEventListener("keydown", e => {
  const card = e.target.closest(".card");
  if (card && e.target === card && (e.key === "Enter" || e.key === " ")) {
    e.preventDefault(); openModal(Number(card.dataset.id));
  }
});
$("search").addEventListener("input", e => { state.search = e.target.value; resetPage(); render(); });
$("sort").addEventListener("change", e => { state.sort = e.target.value; resetPage(); render(); });
$("favOnly").addEventListener("click", e => {
  state.favOnly = !state.favOnly;
  e.currentTarget.setAttribute("aria-pressed", String(state.favOnly));
  resetPage();
  render();
});
$("loadMore").addEventListener("click", () => { shown += PAGE; render(); });
$("mClose").addEventListener("click", closeModal);
$("mFav").addEventListener("click", () => { if (openId !== null) toggleFav(openId); });
$("backdrop").addEventListener("click", e => { if (e.target.id === "backdrop") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("backdrop").hidden) closeModal(); });
$("claimBtn").addEventListener("click", runClaim);
$("claimUser").addEventListener("keydown", e => { if (e.key === "Enter") runClaim(); });

loadFavs();
buildChips("rarityRow", RARITIES, "rarity");
buildChips("elementRow", [...new Set(DATA.map(c => c.element))].sort(), "element");
render();
</script>

</html>
